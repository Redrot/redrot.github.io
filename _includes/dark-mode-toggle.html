<!-- Dark mode switch. Behaviour lives in _includes/dark-mode-init.html. -->
<button type="button" id="theme-toggle" class="theme-toggle"
        aria-label="Switch between light and dark mode" aria-pressed="false"
        title="Switch between light and dark mode">
  <i class="fas fa-moon theme-toggle-to-dark" aria-hidden="true"></i>
  <i class="fas fa-sun theme-toggle-to-light" aria-hidden="true"></i>
</button>
