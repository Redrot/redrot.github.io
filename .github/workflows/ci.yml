name: Beautiful Jekyll CI
on: [push, pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The old workflow built inside the jekyll/builder:3.8 image, which ships
      # Ruby 2.6. That image is no longer maintained, and modern versions of
      # ffi (a transitive dependency) require Ruby >= 3.0, so bundler could no
      # longer resolve the Gemfile and exited 5.
      #
      # Ruby is pinned to 3.3 rather than "latest": this site uses Jekyll 3.x
      # (per beautiful-jekyll-theme.gemspec), whose liquid and safe_yaml
      # dependencies rely on bigdecimal and base64, which stopped being default
      # gems in Ruby 3.4. Moving past 3.3 would need those added to the Gemfile.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build the site
        run: bundle exec jekyll build --future
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
